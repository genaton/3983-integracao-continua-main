name: "Consturção do artefato"

on:
    push:
        branches: ["main" , "curso_2"]
    workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
     - uses: actions/checkout@v4
       
     - name: Build docker image
       run: docker build --target=production -t genaton/3983-integracao-continua-main:${{ github.sha }} .
   
